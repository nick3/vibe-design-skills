name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: "false"

      - name: Install validation dependencies
        run: bun install --frozen-lockfile

      - name: Audit validation dependencies
        run: bun audit

      - name: Validate suite
        run: bun run check

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            test -f "$skill/SKILL.md" || continue
            uvx --from 'git+https://github.com/agentskills/agentskills@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref' \
              skills-ref validate "$skill"
          done

      - name: Verify the published commit through the Skills CLI
        if: github.event_name != 'pull_request'
        env:
          SKILLS_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: bun run check:source -- "$SKILLS_SOURCE"

  windows:
    name: Windows portability
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.7

      - name: Install validation dependencies
        run: bun install --frozen-lockfile

      - name: Validate suite and clean Codex installation
        run: bun run check
